name: Release plugin

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example 0.1.8)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate version tag
        shell: bash
        run: '[[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check manifest and package versions
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const file of ['manifest.json', 'package.json']) {
            assert.equal(JSON.parse(readFileSync(file, 'utf8')).version, process.env.RELEASE_TAG, file);
          }
          NODE

      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npm run smoke

      - name: Upload assets and publish tested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/english-release.json"; then
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/english-release.json`, 'utf8'));
          assert.equal(release.isDraft, true, 'Refusing to modify an already published release');
          NODE
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "English Reading Flow $RELEASE_TAG（测试版）" --notes-from-tag
          fi
          gh release upload "$RELEASE_TAG" \
            dist/main.js dist/manifest.json dist/styles.css \
            "release/english-reading-flow-$RELEASE_TAG.zip" \
            "release/english-reading-flow-$RELEASE_TAG-source.zip" \
            release/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
